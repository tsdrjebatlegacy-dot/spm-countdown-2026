<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0759aa">

<!-- Meta Tags untuk Facebook Preview (Open Graph) -->
<meta property="og:title" content="Countdown Interaktif SPM 2026 🚨">
<meta property="og:description" content="Semak baki hari dan jam menuju peperiksaan SPM 2026. Semoga berjaya!">
<!-- Gantikan URL di bawah dengan link gambar sebenar (contoh imgur) untuk thumbnail FB -->
<meta property="og:image" content="https://contoh-link-gambar-anda.com/thumbnail.jpg"> 
<meta property="og:type" content="website">

<title>Countdown SPM 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#06bbc2,#3978de 48%,#7428dc);font-family:Arial,Helvetica,sans-serif;color:#10131b}
.frame{width:min(100%,550px);padding:9px;background:#fff;box-shadow:0 24px 80px #061c4d70}
.poster{position:relative;aspect-ratio:543/770;overflow:hidden;background:linear-gradient(#1475d2,#d9f5ff 48%,#094a99);background-size:cover;background-position:center}
.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#001f5b24 0%,transparent 36%,transparent 70%,#001f5b18);pointer-events:none}
.bgcrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.content{position:absolute;z-index:1;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:7% 9% 5%;}
.brand{font-size:clamp(2.6rem,11vw,4.6rem);font-weight:1000;line-height:.88;letter-spacing:-.06em;color:white;text-shadow:0 4px 0 #083a92,0 7px 15px #001b4b;transform:rotate(-4deg);margin:1% 0 4%}
.brand span{display:block;font-size:1.2em;color:#ffd629;-webkit-text-stroke:1px #a44e00;text-shadow:0 4px 0 #173d85,0 7px 10px #001c4d}
.year{font-size:.46em;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 #16458d}
.emblem{margin-left:auto;border:1px solid #ffffffb8;background:#ffffffde;color:#183a6e;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-size:9px;font-weight:900;position:absolute;right:6%;top:5%}

/* Tambahan Animasi "Float" pada Card */
.card{width:100%;margin-top:auto;margin-bottom:auto;padding:6% 4%;background:#ffffffed;border:5px solid #f5f8ff;outline:2px solid #1353ac;box-shadow:0 6px 20px #002d7350;clip-path:polygon(0 3%,5% 0,95% 0,100% 3%,100% 97%,95% 100%,5% 100%,0 97%); animation: float 4s ease-in-out infinite;}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

.timer{display:flex;align-items:baseline;justify-content:center;gap:9px;font-variant-numeric:tabular-nums;line-height:1}
.big{font-size:clamp(4rem,18vw,7.3rem);letter-spacing:-.075em;font-weight:400;color:#080b13}

/* Tambahan Kesan Glow untuk warna Merah */
.red{color:#ed1827; text-shadow: 0 0 10px rgba(237, 24, 39, 0.3);}

/* Tambahan Animasi Kelip (Blink) pada Titik Bertindih */
.colon{font-size:clamp(3.5rem,15vw,6rem);font-weight:300; animation: blink 1s step-start infinite;}

@keyframes blink {
  50% { opacity: 0.3; }
}

.units{display:flex;justify-content:center;gap:clamp(40px,16vw,112px);font-size:clamp(1rem,5vw,1.65rem);font-weight:800;margin:7px 0 9px}
.note{font-size:clamp(.57rem,2vw,.74rem);line-height:1.25;font-weight:700;margin:0 auto 10px;max-width:400px}
.bell{font-size:clamp(2.4rem,9vw,4rem);margin:2px 0; animation: swing 2s ease-in-out infinite transform-origin: top center;}

/* Sedikit pergerakan pada loceng 🚨 */
@keyframes swing {
  0%, 100% { transform: rotate(0deg); }
  10%, 30% { transform: rotate(10deg); }
  20%, 40% { transform: rotate(-10deg); }
  50% { transform: rotate(0deg); }
}

.exam{color:#172c95;font-size:clamp(1rem,4.5vw,1.55rem);font-weight:900;margin:3px 0}
.range{font-size:clamp(1rem,4vw,1.45rem);font-weight:800;line-height:1.18;margin:0}
.footer{font-size:clamp(.72rem,2.6vw,.95rem);font-weight:800;margin-top:5px}
.controls{padding:15px 5px 3px;color:#13264b;font-size:.85rem;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.controls input{font:inherit;border:1px solid #315b9b;border-radius:7px;padding:6px 8px;background:#fff}
.notice{font-size:.75rem;color:#344563;text-align:center;margin:5px 0 0}
@media(min-width:650px){.frame{width:500px}}
</style></head>
<body><div class="frame"><div class="poster" id="poster"><img class="bgcrop" id="bg" src="countdown-reference.jpg" alt="" style="display:none;"><div class="content"><div class="emblem">SPM<br>2026</div><div class="brand">COUNTDOWN<span>SPM <span class="year">2026</span></span></div><div class="card"><div class="timer"><div><span class="big" id="days">—</span></div><span class="colon">:</span><div><span class="big red" id="hours">—</span></div></div><div class="units"><span>HARI</span><span>JAM</span></div><p class="note">Baki hari dikira mengikut kalendar. Kiraan berubah setiap saat menuju peperiksaan.</p><div class="bell">🚨</div><div class="exam">Peperiksaan Bertulis<br>SPM 2026</div><p class="range" id="dateRange">Tetapkan tarikh peperiksaan</p><div class="footer" id="message">Semoga berjaya — teruskan usaha!</div></div></div></div><div class="controls"><label for="target">Tarikh peperiksaan:</label><input id="target" type="date"></div><p
class="notice">Tarikh sasaran disimpan pada peranti ini dan boleh diubah bila-bila masa.</p></div>
<script>
// Memperbaiki sedikit sintaks string literal (tambah backtick) pada bahagian url()
const bg=document.getElementById('bg');
bg.onload=()=>{
    const c=document.createElement('canvas');
    c.width=543;
    c.height=770;
    c.getContext('2d').drawImage(bg,24,304,543,770,0,0,543,770);
    document.getElementById('poster').style.backgroundImage=`url(${c.toDataURL('image/jpeg',.92)})`;
    bg.remove();
};

const input=document.getElementById('target');
const saved=localStorage.getItem('spm-target-date');
if(saved)input.value=saved;else input.value='2026-11-23';

const format=d=>new Intl.DateTimeFormat('ms-MY',{day:'numeric',month:'long',year:'numeric'}).format(d);

function tick(){
    if(!input.value){
        document.getElementById('days').textContent='—';
        document.getElementById('hours').textContent='—';
        document.getElementById('dateRange').textContent='Tetapkan tarikh peperiksaan';
        return;
    }
    const t=new Date(input.value+'T00:00:00'),now=new Date(),ms=t-now;
    document.getElementById('dateRange').textContent=format(t);
    
    if(ms<=0){
        document.getElementById('days').textContent='00';
        document.getElementById('hours').textContent='00';
        document.getElementById('message').textContent='Semoga berjaya menduduki peperiksaan!';
        return;
    }
    const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000);
    document.getElementById('days').textContent=d.toLocaleString('ms-MY');
    document.getElementById('hours').textContent=String(h).padStart(2,'0');
}

input.addEventListener('change',()=>{
    if(input.value)localStorage.setItem('spm-target-date',input.value);
    tick();
});
tick();
setInterval(tick,1000);
</script></body></html>
