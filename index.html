<style>

/* =====================================================
   GLOBAL
===================================================== */

:root{

  --blue:#0759aa;
  --red:#ef161e;
  --ink:#111319;

}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
  margin:0;
}

body{

  min-height:100vh;

  display:grid;

  place-items:center;

  padding:18px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(255,255,255,.22),
      transparent 25%
    ),

    linear-gradient(
      135deg,
      #05bbc2,
      #3978de 50%,
      #7428dc
    );

  color:#10223f;

}


/* =====================================================
   MAIN WRAPPER
===================================================== */

.shell{

  width:min(
    100%,
    550px
  );

}


/* =====================================================
   POSTER FRAME
===================================================== */

.poster-wrap{

  padding:5px;

  background:#fff;

  border-radius:5px;

  box-shadow:
    0 24px 70px
    rgba(0,26,78,.38);

}


.poster{

  position:relative;

  width:100%;

  /*
    Nisbah poster HD / 4K terbaru
  */

  aspect-ratio:1024 / 1450;

  overflow:hidden;

  background:#eaf6fb;

}


/* =====================================================
   POSTER BACKGROUND
===================================================== */

.poster-bg{

  position:absolute;

  inset:0;

  z-index:1;

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

  user-select:none;

  -webkit-user-drag:none;

}


/* =====================================================
   LIVE COUNTDOWN

   TIADA BACKGROUND.
   Hanya nombor dan colon berada di atas poster.

   HARI dan JAM sudah terdapat dalam poster background.
===================================================== */

.countdown-live{

  position:absolute;

  z-index:10;

  /*
    Kedudukan countdown pada ruang kosong poster.
  */

  left:20.2%;

  top:34.0%;

  width:55.8%;

  height:13%;

  display:grid;

  grid-template-columns:
    1fr
    .33fr
    1fr;

  align-items:center;

  justify-items:center;

  background:transparent;

  pointer-events:none;

}


/* =====================================================
   COUNTDOWN NUMBER
===================================================== */

.number{

  display:block;

  font-variant-numeric:
    tabular-nums;

  font-size:
    clamp(
      3.4rem,
      17vw,
      5.8rem
    );

  font-weight:400;

  line-height:1;

  letter-spacing:-.06em;

  color:var(--ink);

  transform-origin:center;

  text-align:center;

}


.number.hours{

  color:var(--red);

}


/* =====================================================
   COLON
===================================================== */

.colon{

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:
    clamp(
      3rem,
      14vw,
      5rem
    );

  font-weight:300;

  line-height:1;

  color:#171717;

  transform:
    translateY(-2px);

  animation:
    colonPulse
    1.5s
    ease-in-out
    infinite;

}


/* =====================================================
   NUMBER CHANGE ANIMATION
===================================================== */

.change{

  animation:
    numberChange
    .34s
    ease-out;

}


/* =====================================================
   LIVE STATUS
===================================================== */

.status-row{

  display:flex;

  justify-content:center;

  margin-top:10px;

}


.status{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  padding:
    7px 12px;

  border:
    1px solid
    rgba(255,255,255,.72);

  border-radius:
    999px;

  background:
    rgba(255,255,255,.94);

  box-shadow:
    0 7px 20px
    rgba(0,32,92,.16);

  font-size:.72rem;

  font-weight:900;

  color:#50647e;

  backdrop-filter:
    blur(8px);

}


/* =====================================================
   STATUS DOT
===================================================== */

.dot{

  width:8px;

  height:8px;

  border-radius:50%;

  background:#d79b00;

  box-shadow:
    0 0 0 4px
    rgba(215,155,0,.12);

}


.status.live{

  color:#08733f;

}


.status.live .dot{

  background:#12a65b;

  box-shadow:
    0 0 0 4px
    rgba(18,166,91,.12);

  animation:
    livePulse
    1.8s
    ease-in-out
    infinite;

}


.status.offline{

  color:#9b4137;

}


.status.offline .dot{

  background:#d84d3d;

  box-shadow:
    0 0 0 4px
    rgba(216,77,61,.12);

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions{

  display:flex;

  justify-content:center;

  gap:8px;

  flex-wrap:wrap;

  margin-top:9px;

}


button{

  appearance:none;

  border:0;

  border-radius:10px;

  padding:
    10px 14px;

  font:inherit;

  font-size:.78rem;

  font-weight:900;

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}


button:hover{

  transform:
    translateY(-1px);

}


button:active{

  transform:
    scale(.97);

}


.primary{

  color:#fff;

  background:
    var(--blue);

  box-shadow:
    0 6px 16px
    rgba(0,46,118,.22);

}


.secondary{

  color:#153c6b;

  background:
    rgba(255,255,255,.94);

  border:
    1px solid
    rgba(203,219,236,.95);

}


/* =====================================================
   HINT
===================================================== */

.hint{

  margin:
    8px 0 0;

  text-align:center;

  color:
    rgba(255,255,255,.94);

  font-size:.68rem;

  font-weight:700;

}


/* =====================================================
   IMAGE ERROR
===================================================== */

.image-error{

  position:absolute;

  z-index:2;

  inset:0;

  display:none;

  place-items:center;

  padding:30px;

  text-align:center;

  background:#eef8fc;

  color:#17375e;

  font-size:.8rem;

  font-weight:800;

}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes numberChange{

  0%{

    opacity:.25;

    transform:
      translateY(-5px)
      scale(1.04);

  }

  100%{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


@keyframes colonPulse{

  0%,
  100%{

    opacity:1;

  }

  50%{

    opacity:.55;

  }

}


@keyframes livePulse{

  0%,
  100%{

    transform:
      scale(1);

  }

  50%{

    transform:
      scale(1.18);

  }

}


/* =====================================================
   MOBILE
===================================================== */

@media
(max-width:480px){

  body{

    padding:8px;

  }

  .poster-wrap{

    padding:3px;

  }

  .status{

    font-size:.66rem;

  }

  button{

    padding:
      9px 11px;

    font-size:.72rem;

  }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media
(max-width:360px){

  .countdown-live{

    left:20%;

    width:56%;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media
(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<main class="shell">


  <!-- =================================================
       POSTER
  ================================================== -->

  <div class="poster-wrap">


    <section
      class="poster"
      id="poster"
      aria-label="Countdown SPM 2026"
    >


      <!-- =================================================
           POSTER BACKGROUND
      ================================================== -->

      <img

        class="poster-bg"

        id="posterBg"

        src="spm-countdown-bg.png?v=6"

        alt="Poster Countdown SPM 2026"

      >


      <div
        class="image-error"
        id="imageError"
      >

        Poster sedang dimuatkan...

      </div>



      <!-- =================================================
           LIVE NUMBER

           TIADA WHITE PATCH.
           TIADA HARI / JAM kerana sudah ada dalam poster.
      ================================================== -->

      <div
        class="countdown-live"
        aria-live="polite"
      >


        <span
          class="number"
          id="days"
        >
          --
        </span>


        <span
          class="colon"
          aria-hidden="true"
        >
          :
        </span>


        <span
          class="number hours"
          id="hours"
        >
          --
        </span>


      </div>


    </section>


  </div>



  <!-- =================================================
       LIVE STATUS
  ================================================== -->

  <div class="status-row">


    <div
      class="status"
      id="status"
    >


      <span class="dot"></span>


      <span id="statusText">

        MENYELARASKAN MASA...

      </span>


    </div>


  </div>



  <!-- =================================================
       ACTION BUTTONS
  ================================================== -->

  <div class="actions">


    <button
      class="primary"
      id="shareBtn"
      type="button"
    >

      Kongsi Countdown

    </button>


    <button
      class="secondary"
      id="facebookBtn"
      type="button"
    >

      Facebook

    </button>


    <button
      class="secondary"
      id="fullBtn"
      type="button"
    >

      Paparan Penuh

    </button>


  </div>


  <p class="hint">

    Countdown diselaraskan dengan masa internet Malaysia.

  </p>


</main>



<script>

/* =====================================================
   CONFIGURATION
===================================================== */


/*
  Tarikh mula Peperiksaan Bertulis SPM 2026

  23 November 2026
  12:00 AM
  Malaysia UTC+8
*/

const TARGET_EPOCH =

  Date.parse(
    '2026-11-23T00:00:00+08:00'
  );


/*
  Sync internet semula setiap 5 minit.
*/

const SYNC_EVERY =

  5 * 60 * 1000;


/*
  URL rasmi GitHub Pages.
*/

const PAGE_URL =

  'https://tsdrjebatlegacy-dot.github.io/spm-countdown-2026/';


/*
  Fallback poster jika relative image gagal.
*/

const FALLBACK_POSTER =

  'https://raw.githubusercontent.com/tsdrjebatlegacy-dot/spm-countdown-2026/main/spm-countdown-bg.png';



/* =====================================================
   ELEMENTS
===================================================== */

const daysEl =

  document.getElementById(
    'days'
  );


const hoursEl =

  document.getElementById(
    'hours'
  );


const statusEl =

  document.getElementById(
    'status'
  );


const statusText =

  document.getElementById(
    'statusText'
  );


const shareBtn =

  document.getElementById(
    'shareBtn'
  );


const facebookBtn =

  document.getElementById(
    'facebookBtn'
  );


const fullBtn =

  document.getElementById(
    'fullBtn'
  );


const posterBg =

  document.getElementById(
    'posterBg'
  );


const imageError =

  document.getElementById(
    'imageError'
  );



/* =====================================================
   POSTER IMAGE FALLBACK
===================================================== */

let posterFallbackUsed = false;


posterBg.addEventListener(
  'load',
  () => {

    imageError.style.display =
      'none';

  }
);


posterBg.addEventListener(
  'error',
  () => {


    if(
      !posterFallbackUsed
    ){

      posterFallbackUsed =
        true;


      console.warn(
        'Poster utama gagal. Menggunakan GitHub Raw.'
      );


      posterBg.src =

        FALLBACK_POSTER +

        '?v=' +

        Date.now();


      return;

    }


    imageError.style.display =
      'grid';


    imageError.textContent =

      'Poster tidak dapat dimuatkan. Sila refresh halaman.';


  }
);



/* =====================================================
   INTERNET TIME DATA
===================================================== */

let internetOffset =

  Number(

    localStorage.getItem(
      'spmInternetOffset'
    )

  ) || 0;


let hasInternetSync =

  localStorage.getItem(
    'spmHasInternetSync'
  ) === '1';



/* =====================================================
   CURRENT TIME
===================================================== */

function currentTime(){

  return (

    Date.now() +
    internetOffset

  );

}



/* =====================================================
   LIVE STATUS
===================================================== */

function setStatus(
  type,
  text
){

  statusEl.classList.remove(
    'live',
    'offline'
  );


  if(type){

    statusEl.classList.add(
      type
    );

  }


  statusText.textContent =
    text;

}



/* =====================================================
   INTERNET TIME SYNC
===================================================== */

async function syncInternetTime(){


  /*
    Jika HTML dibuka terus dalam komputer
    dan belum melalui GitHub Pages.
  */

  if(
    location.protocol === 'file:'
  ){

    setStatus(
      'offline',
      'LOCAL • LIVE SELEPAS PUBLISH'
    );

    return;

  }


  try{


    const requestUrl =

      new URL(
        PAGE_URL
      );


    /*
      Elak browser cache.
    */

    requestUrl.searchParams.set(

      '_time',

      Date.now()

    );


    const sentAt =

      Date.now();


    let response;


    /*
      Cuba HEAD dahulu.
    */

    try{


      response =

        await fetch(
          requestUrl.toString(),
          {

            method:'HEAD',

            cache:'no-store'

          }
        );


    }
    catch(error){


      /*
        Jika HEAD tidak berjaya,
        cuba GET.
      */

      response =

        await fetch(
          requestUrl.toString(),
          {

            method:'GET',

            cache:'no-store'

          }
        );


    }


    const receivedAt =

      Date.now();


    /*
      Baca masa server melalui HTTP Date Header.
    */

    const dateHeader =

      response.headers.get(
        'date'
      );


    if(
      !dateHeader
    ){

      throw new Error(
        'Date header tidak tersedia.'
      );

    }


    const serverEpoch =

      Date.parse(
        dateHeader
      );


    if(
      !Number.isFinite(
        serverEpoch
      )
    ){

      throw new Error(
        'Server time tidak sah.'
      );

    }


    /*
      Anggaran latency internet.
    */

    const halfLatency =

      (
        receivedAt -
        sentAt
      ) / 2;


    /*
      Beza masa antara server
      dengan jam peranti.
    */

    internetOffset =

      (
        serverEpoch +
        halfLatency
      ) -

      receivedAt;


    hasInternetSync =
      true;


    /*
      Simpan offset.
    */

    localStorage.setItem(

      'spmInternetOffset',

      String(
        internetOffset
      )

    );


    localStorage.setItem(

      'spmHasInternetSync',

      '1'

    );


    /*
      Masa Malaysia.
    */

    const syncTime =

      new Intl.DateTimeFormat(
        'ms-MY',
        {

          hour:'2-digit',

          minute:'2-digit',

          second:'2-digit',

          hour12:true,

          timeZone:
            'Asia/Kuala_Lumpur'

        }
      )
      .format(

        new Date(
          currentTime()
        )

      );


    setStatus(

      'live',

      `LIVE • INTERNET TIME • ${syncTime}`

    );


  }
  catch(error){


    console.warn(
      'Time Sync:',
      error
    );


    if(
      hasInternetSync
    ){


      setStatus(
        'offline',
        'OFFLINE • SYNC TERAKHIR'
      );


    }
    else{


      setStatus(
        'offline',
        'LOCAL TIME • MENUNGGU SYNC'
      );


    }


  }

}



/* =====================================================
   NUMBER ANIMATION
===================================================== */

function animateValue(
  element,
  value
){

  const text =

    String(
      value
    );


  if(
    element.textContent ===
    text
  ){

    return;

  }


  element.classList.remove(
    'change'
  );


  /*
    Force browser repaint.
  */

  void element.offsetWidth;


  element.textContent =
    text;


  element.classList.add(
    'change'
  );

}



/* =====================================================
   COUNTDOWN
===================================================== */

function tick(){


  const diff =

    TARGET_EPOCH -
    currentTime();


  /*
    Apabila peperiksaan sudah bermula.
  */

  if(
    diff <= 0
  ){


    animateValue(
      daysEl,
      '00'
    );


    animateValue(
      hoursEl,
      '00'
    );


    return;

  }


  /*
    Hari penuh yang berbaki.
  */

  const days =

    Math.floor(

      diff /

      86400000

    );


  /*
    Jam selepas hari penuh.
  */

  const hours =

    Math.floor(

      (
        diff %
        86400000
      ) /

      3600000

    );


  /*
    Update hari.
  */

  animateValue(

    daysEl,

    days.toLocaleString(
      'ms-MY'
    )

  );


  /*
    Update jam.
  */

  animateValue(

    hoursEl,

    String(
      hours
    )
    .padStart(
      2,
      '0'
    )

  );

}



/* =====================================================
   SHARE
===================================================== */

shareBtn.addEventListener(
  'click',
  async () => {


    const data = {

      title:
        'Countdown SPM 2026',

      text:
        'Live Countdown menuju Peperiksaan Bertulis SPM 2026.',

      url:
        PAGE_URL

    };


    try{


      /*
        Mobile native share.
      */

      if(
        navigator.share
      ){


        await navigator.share(
          data
        );


        return;

      }


      /*
        Desktop fallback.
      */

      await navigator.clipboard.writeText(
        PAGE_URL
      );


      const originalText =

        shareBtn.textContent;


      shareBtn.textContent =

        'Link Disalin ✓';


      setTimeout(
        () => {


          shareBtn.textContent =

            originalText;


        },
        1600
      );


    }
    catch(error){


      console.warn(
        'Share error:',
        error
      );


    }


  }
);



/* =====================================================
   FACEBOOK SHARE
===================================================== */

facebookBtn.addEventListener(
  'click',
  () => {


    const facebookUrl =

      'https://www.facebook.com/sharer/sharer.php?u=' +

      encodeURIComponent(
        PAGE_URL
      );


    window.open(

      facebookUrl,

      '_blank',

      'noopener,noreferrer'

    );


  }
);



/* =====================================================
   FULLSCREEN
===================================================== */

fullBtn.addEventListener(
  'click',
  async () => {


    try{


      if(
        !document.fullscreenElement
      ){


        await document
          .documentElement
          .requestFullscreen();


        fullBtn.textContent =
          'Keluar Penuh';


      }
      else{


        await document
          .exitFullscreen();


      }


    }
    catch(error){


      console.warn(
        'Fullscreen:',
        error
      );


    }


  }
);



document.addEventListener(
  'fullscreenchange',
  () => {


    fullBtn.textContent =

      document.fullscreenElement
        ? 'Keluar Penuh'
        : 'Paparan Penuh';


  }
);



/* =====================================================
   CONNECTION EVENTS
===================================================== */

window.addEventListener(
  'online',
  () => {


    syncInternetTime();


  }
);


window.addEventListener(
  'offline',
  () => {


    setStatus(
      'offline',
      'OFFLINE • SYNC TERAKHIR'
    );


  }
);



/* =====================================================
   START
===================================================== */


/*
  Paparkan countdown terus.
*/

tick();


/*
  Update setiap satu saat.
*/

setInterval(
  tick,
  1000
);


/*
  Sync internet selepas halaman dibuka.
*/

syncInternetTime();


/*
  Sync semula setiap 5 minit.
*/

setInterval(
  syncInternetTime,
  SYNC_EVERY
);


</script>


</body>
